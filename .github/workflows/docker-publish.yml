name: docker-publish

# Build the marketplace container (repo-root Dockerfile) and push it to the
# GitHub container registry. Render.com pulls the image from here.
# The GHCR package starts private; the last step tries to switch it to public
# via the repo's token (works when the package is linked to this repo).

on:
  push:
    branches: [elektron/main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "web/**"
      - "mm2src/elek_web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:testnet
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # No KDF_BUILD_TAG build-arg on purpose: the arg feeds an ENV in the
        # builder stage and would change the cargo-build layer digest on every
        # commit, defeating the GHA layer cache. Version traceability lives in
        # the :sha-<sha> image tag instead; the binary keeps the default
        # 'elektron-docker' stamp from the Dockerfile ARG.
      - name: make ghcr package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/user/packages/container/elektron-net-kdf" \
            -f visibility=public